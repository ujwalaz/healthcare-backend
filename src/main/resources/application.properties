# ============================================================
# Healthcare OPD Platform - Application Configuration
# Database: Azure SQL Database (SQL Server)
# Storage : Azure Blob Storage
# ============================================================

# --- Server --------------------------------------------------
server.port=8080

# --- MVC: return 404 (not 500) for unmapped endpoints ---------
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# --- Azure SQL Database --------------------------------------
# Replace <server>, <database>, <username>, <password> with your Azure SQL values.
# Azure SQL Server name format: <server>.database.windows.net
spring.datasource.url=jdbc:sqlserver://medical-data.database.windows.net:1433;database=medicalDatabase;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;sendTimeAsDatetime=false;
spring.datasource.username=medDev
spring.datasource.password=dev@2026
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Connection pool (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# --- JPA / Hibernate -----------------------------------------
#spring.jpa.hibernate.ddl-auto=none
#spring.jpa.show-sql=false
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
#spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.open-in-view=false

# --- Flyway --------------------------------------------------
spring.flyway.enabled=false

# --- JWT -----------------------------------------------------
# Secret must be at least 32 characters (256-bit for HS256).
app.jwt.secret=YourSuperSecretKeyHereAtLeast32CharsLong!!
app.jwt.expiration-ms=86400000

# --- Azure Blob Storage --------------------------------------
# Replace with your Storage Account connection string.
app.azure.storage.connection-string=DefaultEndpointsProtocol=https;AccountName=healthcarepmr;AccountKey=8Vsxdzbo6REbWjV0LjUq3ZfDiZZ9o/AnnA9PA2BUilLb0oC1+NvmbmC98OtRky3F1IVPM7f0eEmZ+AStXCFejg==;EndpointSuffix=core.windows.net
app.azure.storage.container-name=healthcare-docs
app.azure.storage.sas-expiry-minutes=60

# --- Jackson ------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false

# --- Multipart (file upload) ---------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# --- Doctor document access window ---------------------------
# How many minutes before appointment start a doctor can view patient-uploaded documents
app.document.doctor-access.prior-minutes=30
# How many minutes after appointment end the access remains valid
app.document.doctor-access.post-minutes=60